  <!-- Lotus Flower / Calm symbol -->
  <path d="M 300 120 C 320 160, 325 210, 300 240 C 275 210, 280 160, 300 120 Z" fill="url(#petalPink)"/>
  <path d="M 300 240 C 330 235, 370 210, 370 170 C 350 205, 320 225, 300 240 Z" fill="#ff5ea8" fill-opacity="0.75"/>
  <path d="M 300 240 C 270 235, 230 210, 230 170 C 250 205, 280 225, 300 240 Z" fill="#ff5ea8" fill-opacity="0.75"/>
