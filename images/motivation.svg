      <stop offset="0%" stop-color="#fff6fa"/>
      <stop offset="100%" stop-color="#ffd0e5"/>
    </linearGradient>
    <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff86bf"/>
      <stop offset="100%" stop-color="#cf437e"/>
