<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 6 — smoke tests</title>
  <style>
    body {
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #221720;
      font: 1rem/1.6 system-ui, sans-serif;
    }

    button {
      padding: 0.65rem 1rem;
      font: inherit;
      cursor: pointer;
    }

    #test-results {
      padding-left: 1.5rem;
    }

    .test-pass {
      color: #185c37;
    }

    .test-fail {
      color: #a31717;
    }

    #test-frame {
      position: fixed;
      top: 0;
      left: -1000px;
      width: 390px;
      height: 844px;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Проверка задания 6</h1>
    <p>Откройте эту страницу через локальный HTTP-сервер, затем запустите проверки.</p>
    <button id="run-tests" type="button">Запустить проверки</button>
    <p id="test-summary" role="status" aria-live="polite">Проверки ещё не запускались.</p>
    <ol id="test-results"></ol>
    <iframe id="test-frame" title="Страница для проверки" aria-hidden="true"></iframe>
  </main>
  <script src="assignment6-smoke.js?v=4" defer></script>
</body>
</html>
